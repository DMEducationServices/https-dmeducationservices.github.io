<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DM Education Services</title>
  <meta name="description" content="Personalised 1‑to‑1 tutoring in Scotland (in person) and online worldwide. Primary literacy & mathematics, STEM‑focused, making learning fun." />
  <meta name="theme-color" content="#0047FF" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>✏️</text></svg>">

  <script>
    // Tailwind brand colours
    window.tailwind = {
      theme: {
        extend: {
          colors: {
            brand: { blue: '#0047FF', red: '#FF2E2E', teal: '#00C7B2', yellow: '#FFD500' }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    window.RECAPTCHA_SITE_KEY = "6LeACbgrAAAAAHPbeFY3AR-W6jayYWoTK9TtP6fB"; // test key
  </script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>


  <!-- Pinned CDNs (no redirects) -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.6/babel.min.js"></script>

  <style>
    html { scroll-behavior: smooth; }
    :root { --ring: 0 0 0 3px rgba(0,71,255,0.35) } 
    .focus-ring:focus { outline: var(--ring) solid 2px; outline-offset: 2px; }
  </style>
</head>
<body class="bg-white text-slate-900">
  <div id="root"></div>

  <!-- React app with a tiny hash router (no external router lib needed) -->
  <script type="text/babel" data-presets="env,react" data-presets="env,react">
    const { useEffect, useState, useRef } = React;

    // ---- Tiny Hash Router ----
    const useHashLocation = () => {
      const get = () => location.hash.slice(1) || "/";
      const [path, setPath] = useState(get());
      useEffect(()=>{
        const onHash = () => setPath(get());
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      const navigate = (to) => { if (to !== path) location.hash = to; };
      return [path, navigate];
    };

    const Link = ({ to, children, className="" }) => (
      <a href={"#" + to} className={className}>{children}</a>
    );

    // ---- Shared UI ----
    const Container = ({ children, className = "" }) => (
      <div className={"max-w-6xl mx-auto px-4 " + className}>{children}</div>
    );

    const Logo = ({ className = "h-20 w-auto" }) => (
      <div className="flex items-center gap-3">
        <img src="./logo.jpg" alt="DM Education Services" className={className + " object-contain"} onError={(e)=>{e.target.style.display='none';}} />
        <div className="font-extrabold tracking-tight leading-tight sr-only">
          <div className="text-2xl text-brand-blue">DM <span className="text-slate-900">Education</span></div>
          <div className="text-xs -mt-1 text-slate-500">Services Ltd</div>
        </div>
      </div>
    );

    const PrimaryButton = ({ to, children, className="" }) => (
      <Link to={to} className={"inline-flex items-center justify-center rounded-2xl px-5 py-3 font-semibold shadow-sm transition bg-[#0047FF] text-white hover:opacity-90 " + className}>{children}</Link>
    );

    const SecondaryButton = ({ to, children, className="" }) => (
      <Link to={to} className={"inline-flex items-center justify-center rounded-2xl px-5 py-3 font-semibold border border-slate-300 hover:bg-slate-50 transition " + className}>{children}</Link>
    );

    const SectionHeader = ({ kicker, title, subtitle }) => (
      <div className="text-center mb-10">
        {kicker && <div className="text-brand-teal font-semibold uppercase tracking-wider text-sm">{kicker}</div>}
        <h2 className="text-3xl md:text-4xl font-extrabold mt-2">{title}</h2>
        {subtitle && <p className="mt-3 text-slate-600 max-w-2xl mx-auto">{subtitle}</p>}
      </div>
    );

    const Nav = ({ current }) => {
      const link = (to, label) => (
        <Link key={to} to={to} className={"px-3 py-2 rounded-lg text-sm font-semibold " + (current===to ? "text-brand-blue" : "text-slate-600 hover:text-slate-900")}>{label}</Link>
      );
      return (
        <header className="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-slate-100">
          <Container className="flex items-center justify-between py-3">
            <Link to="/" className="shrink-0"><Logo /></Link>
            <nav className="hidden md:flex items-center gap-1">
              {link("/", "Home")}
              {link("/about", "About")}
              {link("/services", "Services")}
              {link("/resources", "Free Resources")}
              {link("/contact", "Contact")}
            </nav>
            <div className="hidden md:flex gap-2">
              <SecondaryButton to="/free-consultation">Free Consultation</SecondaryButton>
              <PrimaryButton to="/free-resource">Get Free Resource</PrimaryButton>
            </div>
          </Container>
        </header>
      );
    };

    const Footer = () => (
      <footer className="mt-20 border-t border-slate-100">
        <Container className="py-10 grid md:grid-cols-3 gap-8 items-center">
          <div><Logo className="h-8" />
            <p className="text-sm text-slate-500 mt-3">Personalised 1‑to‑1 tutoring in Scotland or online worldwide. Primary literacy & maths. STEM specialists. Making learning fun.</p>
          </div>
          <div className="text-sm">
            <div className="font-semibold mb-2">Navigate</div>
            <ul className="space-y-1">
              <li><Link to="/">Home</Link></li>
              <li><Link to="/about">About</Link></li>
              <li><Link to="/services">Services</Link></li>
              <li><Link to="/resources">Free Resources</Link></li>
              <li><Link to="/contact">Contact</Link></li>
            </ul>
          </div>
          <div className="text-sm">
            <div className="font-semibold mb-2">Get Started</div>
            <div className="flex gap-2">
              <PrimaryButton to="/free-consultation" className="px-4 py-2">Book Free Chat</PrimaryButton>
              <SecondaryButton to="/free-resource" className="px-4 py-2">Free Resource</SecondaryButton>
            </div>
          </div>
          <div className="md:col-span-3 text-xs text-slate-400">© <span id="year"></span> DM Education Services Ltd. All rights reserved.</div>
        </Container>
      </footer>
    );

    // ---- Pages ----
    const Home = () => (
      <main>
        <section className="bg-gradient-to-b from-brand-blue/5 to-transparent">
          <Container className="py-16 md:py-24 grid md:grid-cols-2 gap-10 items-center">
            <div>
              <span className="inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold bg-brand-teal/10 text-brand-teal">1‑to‑1 tutoring · Scotland & Online</span>
              <h1 className="text-4xl md:text-5xl font-extrabold leading-tight mt-4">Making education fun—
                <span className="text-brand-blue"> personalised tutoring</span> for primary literacy & mathematics</h1>
              <p className="mt-5 text-lg text-slate-600">We specialise in STEM and build confidence through engaging, tailored lessons delivered in person across Scotland or online worldwide.</p>
              <div className="mt-6 flex flex-wrap gap-3">
                <PrimaryButton to="/free-consultation">Book your free consultation</PrimaryButton>
                <SecondaryButton to="/services">See services</SecondaryButton>
              </div>
              <ul className="mt-8 grid grid-cols-2 gap-4 text-sm">
                {['Qualified, PVG‑checked tutors','Curriculum‑aligned lessons','Weekly progress updates','Fun, hands‑on STEM'].map((t,i)=> (
                  <li key={i} className="flex items-center gap-2">
                    <span className="h-2.5 w-2.5 rounded-full bg-brand-blue"></span>
                    <span>{t}</span>
                  </li>
                ))}
              </ul>
            </div>
            <div className="relative">
              <div className="rounded-3xl border border-slate-200 p-6 bg-white shadow-sm">
                <img src="./logo.jpg" alt="DM Education Services logo" className="w-full rounded-2xl object-contain" onError={(e)=>{e.target.src='https://dummyimage.com/800x500/edf2f7/1f2937&text=DM+Education+Services';}} />
              </div>
            </div>
          </Container>
        </section>

        <section>
          <Container className="py-16">
            <SectionHeader kicker="Why us" title="Personal, patient, progress‑driven" subtitle="Every child learns differently. We meet them where they are and make learning enjoyable."/>
            <div className="grid md:grid-cols-3 gap-6">
              {[
                { title:'1‑to‑1 attention', body:'Tailored sessions focusing on your child’s goals, interests and pace.' },
                { title:'STEM made fun', body:'Maths & science through puzzles, experiments and real‑world problems.' },
                { title:'In person or online', body:'We cover Scotland in person and teach globally online.' },
              ].map((f,i)=> (
                <div key={i} className="rounded-2xl border border-slate-200 p-6">
                  <div className="text-brand-blue font-bold">{f.title}</div>
                  <p className="text-slate-600 mt-2">{f.body}</p>
                </div>
              ))}
            </div>
          </Container>
        </section>

        <section className="bg-slate-50">
          <Container className="py-16 grid md:grid-cols-2 gap-10 items-center">
            <div>
              <h3 className="text-2xl font-extrabold">Free starter pack: <span className="text-brand-blue">Number Ninja</span></h3>
              <p className="text-slate-600 mt-3">A printable set of games and activities designed to boost number sense for ages 6–11.</p>
              <div className="mt-4 flex gap-3">
                <PrimaryButton to="/free-resource">Get the free resource</PrimaryButton>
                <SecondaryButton to="/resources">Browse more resources</SecondaryButton>
              </div>
            </div>
            <div className="rounded-2xl bg-white border border-slate-200 p-6">
              <ul className="space-y-2 text-sm text-slate-700">
                <li>• 10 short, fun activities</li>
                <li>• Parent/teacher guidance</li>
                <li>• Printable PDF</li>
              </ul>
            </div>
          </Container>
        </section>
      </main>
    );

    const About = () => (
      <Container className="py-16">
        <SectionHeader kicker="About" title="We’re DM Education Services" subtitle="Founded in Scotland with a mission to make learning joyful and effective."/>
        <div className="prose max-w-none">
          <p>We deliver patient, confidence‑building tutoring that’s fully tailored to each learner. Sessions blend literacy and mathematics with hands‑on STEM so pupils see how ideas connect to the real world.</p>
          <p>We work with primary learners (P1–P7), neurodiverse students, and those who need an extra boost. Whether you’re in Scotland and prefer in‑person sessions or you’re anywhere in the world and want online support, we’ve got you covered.</p>
          <h3>Our approach</h3>
          <ul>
            <li>Initial chat and low‑pressure assessment</li>
            <li>Personalised plan aligned to the Curriculum for Excellence</li>
            <li>Engaging lessons with games, stories and experiments</li>
            <li>Clear goals with regular progress updates</li>
          </ul>
        </div>
      </Container>
    );

    const Services = () => (
      <Container className="py-16">
        <SectionHeader kicker="Services" title="Tutoring that fits your family" subtitle="Flexible options available in person across Scotland or online worldwide."/>
        <div className="grid md:grid-cols-3 gap-6">
          {[
            {title:'1‑to‑1 Weekly Tutoring', price:'£35–£45/hr', list:['Literacy & Maths','STEM projects','Homework help','Weekly updates']},
            {title:'Booster Blocks', price:'£180', list:['6 focused sessions','Exam/transition prep','Confidence building']},
            {title:'Online Global', price:'£30–£40/hr', list:['Zoom/Meet','Interactive tools','Flexible time zones']},
          ].map((s,i)=> (
            <div key={i} className="rounded-2xl border border-slate-200 p-6 flex flex-col">
              <div className="text-xl font-bold">{s.title}</div>
              <div className="text-brand-blue font-extrabold mt-1">{s.price}</div>
              <ul className="mt-3 text-sm text-slate-600 space-y-1 list-disc list-inside">
                {s.list.map((it,j)=>(<li key={j}>{it}</li>))}
              </ul>
              <PrimaryButton to="/free-consultation" className="mt-6">Start with a free consult</PrimaryButton>
            </div>
          ))}
        </div>
      </Container>
    );

    const LeadForm = ({ variant = 'resource' }) => {
  const [path, navigate] = useHashLocation();
  const [status, setStatus] = useState('idle');
  const [captchaOk, setCaptchaOk] = useState(false);
  const formRef = useRef(null);

  // Text variants
  const copy = {
    resource: { title: `Get your free resource`, subtitle: `Enter your details and we'll email you the Number Ninja starter pack.`, submit: `Email me the resource` },
    consult:  { title: `Book your free consultation`, subtitle: `We'll arrange a friendly 15-minute chat to understand your goals.`, submit: `Request consultation` },
    contact:  { title: `Send us a message`, subtitle: `We aim to reply within one business day.`, submit: `Send message` },
  }[variant];

  // reCAPTCHA callback (global so widget can call it)
  window.dmOnCaptcha = function() {
    setCaptchaOk(true);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!captchaOk) {
      alert("Please complete the reCAPTCHA.");
      return;
    }
    setStatus('submitting');

    const action = "https://formsubmit.co/dmtutorservices@gmail.com";
    const formData = new FormData(formRef.current);

    formData.append("_subject",
      variant === 'consult' ? "New Free Consultation Request" :
      variant === 'resource' ? "New Free Resource Request" :
      "New Contact Enquiry"
    );
    formData.append("_next", location.origin + location.pathname + "#/thanks");
    formData.append("_captcha", "true");

    fetch(action, { method: "POST", body: formData })
      .then(res => {
        if (!res.ok) throw new Error("Submit failed");
        setStatus('success');
        // Local copy
        const leads = JSON.parse(localStorage.getItem('dm_leads')||'[]');
        const data = Object.fromEntries(formData.entries());
        leads.push({ ...data, variant, date: new Date().toISOString() });
        localStorage.setItem('dm_leads', JSON.stringify(leads));
        navigate('/thanks');
      })
      .catch(err => {
        console.error(err);
        setStatus('error');
        alert("Sorry, something went wrong sending your message. You can email us directly at hello@dmeducationservices.co.uk");
      });
  };

  return (
    <div className="grid md:grid-cols-2 gap-10 items-start">
      <div>
        <h3 className="text-2xl font-extrabold">{copy.title}</h3>
        <p className="text-slate-600 mt-2">{copy.subtitle}</p>
        <ul className="mt-6 space-y-2 text-sm text-slate-700">
          {variant!=='contact' && <li>• No spam — unsubscribe anytime</li>}
          <li>• Scotland (in person) or online worldwide</li>
          <li>• Primary literacy & maths · STEM</li>
        </ul>
      </div>

      <form ref={formRef} onSubmit={handleSubmit} className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
        <div className="grid gap-4">
          <div>
            <label className="block text-sm font-semibold">Your name</label>
            <input required name="parent_name" className="mt-1 w-full rounded-xl border border-sky-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-blue" />
          </div>

          {/* NEW: Child's name */}
          <div>
            <label className="block text-sm font-semibold">Child’s name</label>
            <input required name="child_name" className="mt-1 w-full rounded-xl border border-sky-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-blue" />
          </div>

          <div>
            <label className="block text-sm font-semibold">Email</label>
            <input required type="email" name="email" className="mt-1 w-full rounded-xl border border-sky-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-blue" />
          </div>

          {(variant==='consult' || variant==='contact') && (
            <>
              <div>
                <label className="block text-sm font-semibold">Phone (optional)</label>
                <input name="phone" className="mt-1 w-full rounded-xl border border-sky-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-blue" />
              </div>

              {/* NEW: Best time to call */}
              <div>
                <label className="block text-sm font-semibold">Best time to call</label>
                <select name="best_time_to_call" className="mt-1 w-full rounded-xl border border-sky-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-blue">
                  <option value="">Select…</option>
                  <option>Morning (9–12)</option>
                  <option>Afternoon (12–3)</option>
                  <option>After school (3–6)</option>
                  <option>Evening (6–8)</option>
                  <option>Weekend</option>
                </select>
              </div>
            </>
          )}

          <div>
            <label className="block text-sm font-semibold">Tell us about your learner</label>
            <textarea name="message" rows="4" className="mt-1 w-full rounded-xl border border-sky-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-blue" placeholder="e.g. P5, needs confidence with fractions"></textarea>
          </div>

          {/* reCAPTCHA */}
          <div className="mt-2">
            <div className="g-recaptcha" data-sitekey={window.RECAPTCHA_SITE_KEY} data-callback="dmOnCaptcha"></div>
          </div>

          <button className="inline-flex items-center justify-center rounded-2xl px-5 py-3 font-semibold shadow-sm transition bg-brand-blue text-white hover:opacity-90 mt-2">
            {status==='submitting' ? 'Sending…' : copy.submit}
          </button>

          <div className="text-xs text-slate-500">Prefer email? Write to <a className="underline" href="mailto:hello@dmeducationservices.co.uk">hello@dmeducationservices.co.uk</a></div>
        </div>
      </form>
    </div>
  );
};
    
    const Resources = () => (
      <Container className="py-16">
        <SectionHeader kicker="Free resources" title="Helpful downloads for parents & teachers" subtitle="Grab a freebie below or request our Number Ninja starter pack."/>
        <div className="grid md:grid-cols-3 gap-6">
          {[
            {title:'Number Ninja (Ages 6–11)', tag:'Maths', cta:'Get free resource', to:'/free-resource'},
            {title:'Story Spark Cards', tag:'Literacy', cta:'Download soon', to:'/resources'},
            {title:'STEM Challenge Grid', tag:'STEM', cta:'Download soon', to:'/resources'},
          ].map((r,i)=> (
            <div key={i} className="rounded-2xl border border-slate-200 p-6 flex flex-col">
              <div className="text-sm text-brand-teal font-semibold">{r.tag}</div>
              <div className="text-lg font-bold mt-1">{r.title}</div>
              <div className="mt-4"></div>
              <PrimaryButton to={r.to} className="mt-auto">{r.cta}</PrimaryButton>
            </div>
          ))}
        </div>
      </Container>
    );

    const Contact = () => (
      <Container className="py-16">
        <SectionHeader kicker="Contact" title="Say hello" subtitle="Questions? Tell us about your learner and we’ll get back to you."/>
        <LeadForm variant="contact" />
      </Container>
    );

    const FreeResource = () => (
      <Container className="py-16">
        <SectionHeader kicker="Free resource" title="Number Ninja starter pack" subtitle="Pop in your details and we\\'ll send the download link to your inbox."/>
        <LeadForm variant="resource" />
      </Container>
    );

    const FreeConsultation = () => (
      <Container className="py-16">
        <SectionHeader kicker="Free consultation" title="Let\\'s chat about your goals" subtitle="A friendly 15‑minute call to see how we can help."/>
        <LeadForm variant="consult" />
      </Container>
    );

    const Thanks = () => (
      <Container className="py-24 text-center">
        <h2 className="text-3xl md:text-4xl font-extrabold">Thank you! 🎉</h2>
        <p className="text-slate-600 mt-3">We\\'ve saved your details and we\\'ll be in touch shortly. Check your inbox (and spam) just in case.</p>
        <div className="mt-6">
          <PrimaryButton to="/">Back to home</PrimaryButton>
        </div>
      </Container>
    );

    // ---- Route map (no external router) ----
    const routes = {
      "/": Home,
      "/about": About,
      "/services": Services,
      "/resources": Resources,
      "/contact": Contact,
      "/free-resource": FreeResource,
      "/free-consultation": FreeConsultation,
      "/thanks": Thanks,
    };

    const App = () => {
      const [path] = useHashLocation();
      useEffect(()=>{ const y = document.getElementById('year'); if (y) y.textContent = new Date().getFullYear(); },[]);
      const Page = routes[path] || Home;
      return (
        <>
          <Nav current={path} />
          <Page />
          <Footer />
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
